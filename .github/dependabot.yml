# Weekly dependency updates, grouped to keep the number of pull requests low.
# Security updates are opened as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tools/api-tests
    schedule:
      interval: monthly
    groups:
      test-tools:
        patterns: ["*"]
